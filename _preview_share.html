<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入门整理分享图预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e8e8;
    display: flex;
    justify-content: center;
    padding: 0;
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .card {
    width: 500px;
    height: 400px;
    background: linear-gradient(160deg, #1296db 0%, #1a9eeb 50%, #eaf6ff 50.5%, #fff 100%);
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 6px 30px rgba(0,0,0,0.15);
    position: relative;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 顶部品牌 */
  .brand-area {
    padding: 22px 0 6px;
  }
  .brand-logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    margin-bottom: 6px;
  }
  .brand-name {
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  /* 主体白区 */
  .body {
    background: #fff;
    margin: 14px 20px 0;
    padding: 22px 24px 20px;
    border-radius: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .icon-big {
    font-size: 42px;
    margin-bottom: 8px;
  }

  .main-title {
    font-size: 20px;
    font-weight: 700;
    color: #1296db;
    line-height: 1.4;
  }
  .sub-info {
    font-size: 12px;
    color: #999;
    margin-top: 6px;
  }
  .tag {
    display: inline-block;
    margin-top: 12px;
    padding: 5px 14px;
    background: #eaf6ff;
    color: #1296db;
    font-size: 11px;
    border-radius: 10px;
    font-weight: 500;
  }

  /* 版权 */
  .footer {
    padding: 12px 0 14px;
    font-size: 10px;
    color: #bbb;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="card" id="shareCard">

  <!-- 品牌条 -->
  <div class="brand-area">
    <img class="brand-logo" src="images/logo.jpg" alt="logo" onerror="this.style.display='none'">
    <div class="brand-name">改变从整理开始</div>
  </div>

  <!-- 主体卡片 -->
  <div class="body">
    <div class="main-title">初学者的家居整理<br>入门计划</div>
    <div class="sub-info">20 步循序整理清单，轻松上手</div>
    <div class="tag">打开小程序 · 免费领取</div>
  </div>

  <!-- 版权 -->
  <div class="footer">© 改变从整理开始</div>

</div>

</body>
</html>

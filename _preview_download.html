<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载清单预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .phone {
    width: 375px;
    height: 667px;
    background: #f5f5f5;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    position: relative;
  }

  /* 模拟导航栏 */
  .navbar {
    height: 44px;
    background: #1296db;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    padding-top: 20px;
  }

  /* 页面内容 */
  .content {
    padding: 16px;
  }

  .header-title {
    font-size: 20px;
    font-weight: 700;
    color: #333;
    text-align: center;
    margin: 12px 0 8px;
  }

  /* 下载卡片 */
  .download-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-top: 20px;
  }
  .download-icon {
    font-size: 48px;
    margin-bottom: 8px;
  }
  .download-title {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 4px;
  }
  .download-desc {
    font-size: 13px;
    color: #999;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .download-btn {
    width: 100%;
    height: 48px;
    background: linear-gradient(135deg, #07c160, #1296db);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .download-btn:active { opacity: 0.85; }

  /* 广告遮罩 */
  .ad-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .ad-overlay.show { display: flex; }

  .ad-box {
    width: 300px;
    background: #222;
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
  }
  .ad-label {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .ad-video-placeholder {
    width: 260px;
    height: 160px;
    background: linear-gradient(135deg, #333, #444);
    border-radius: 8px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    position: relative;
  }
  .ad-timer {
    position: absolute;
    bottom: 8px;
    right: 12px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .ad-skip {
    font-size: 13px;
    color: #999;
    cursor: pointer;
    margin-top: 8px;
  }

  /* PDF 预览遮罩 */
  .pdf-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff;
    display: none;
    flex-direction: column;
    z-index: 300;
  }
  .pdf-overlay.show { display: flex; }

  .pdf-header {
    padding: 12px 16px;
    background: #1296db;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
  }
  .pdf-header button {
    background: none;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }

  .pdf-body {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    font-size: 12px;
    color: #333;
  }
  .pdf-page {
    background: #fff;
    padding: 20px;
    border: 1px solid #eee;
    margin-bottom: 8px;
    border-radius: 4px;
    line-height: 1.8;
    text-align: center;
  }
  .pdf-page h3 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #1296db;
  }
  .pdf-page .checklist-text {
    text-align: left;
    font-size: 13px;
  }
  .pdf-page .checklist-text .done {
    color: #07c160;
  }

  .pdf-actions {
    display: flex;
    gap: 12px;
    padding: 12px 16px 24px;
    border-top: 1px solid #eee;
  }
  .pdf-actions button {
    flex: 1;
    padding: 12px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-print { background: #1296db; color: #fff; }
  .btn-share { background: #07c160; color: #fff; }
  .btn-close-pdf { background: #f5f5f5; color: #666; }
</style>
</head>
<body>

<div class="phone">
  <div class="navbar">从零开始的整理计划</div>
  <div class="content">
    <div class="header-title">初学者的家居整理入门计划</div>

    <!-- 下载卡片 -->
    <div class="download-card">
      <div class="download-icon">📒</div>
      <div class="download-title">免费领取整理手账本</div>
      <div class="download-desc">可打印的整理手账模板<br>包含月度计划、物品清单、断舍离记录</div>
      <button class="download-btn" onclick="showAd()">📥 免费下载手账本</button>
    </div>
  </div>

  <!-- 广告遮罩 -->
  <div class="ad-overlay" id="adOverlay">
    <div class="ad-box">
      <div class="ad-label">专属推荐</div>
      <div class="ad-video-placeholder" id="adVideo">
        <div>🎥</div>
        <div class="ad-timer" id="adTimer">15 秒</div>
      </div>
      <div class="ad-skip" id="adSkip" onclick="skipAd()" style="display:none;">跳过广告 →</div>
    </div>
  </div>

  <!-- PDF 预览 -->
  <div class="pdf-overlay" id="pdfOverlay">
    <div class="pdf-header">
      <span>📒 整理手账本.pdf</span>
      <div>
        <button>转发</button>
        <button>导出</button>
      </div>
    </div>
    <div class="pdf-body">
      <div class="pdf-page">
        <h3>📒 我的整理手账本</h3>
        <div style="text-align:center;color:#999;font-size:13px;margin-bottom:12px;">改变从整理开始</div>
        <div style="background:#f9f9f9;padding:12px;border-radius:8px;margin-bottom:10px;">
          <b>📅 月度整理目标</b>
          <p style="margin:4px 0;font-size:11px;">本月计划整理区域：_________</p>
          <p style="margin:4px 0;font-size:11px;">预计完成时间：_________</p>
        </div>
        <div style="background:#f9f9f9;padding:12px;border-radius:8px;margin-bottom:10px;">
          <b>🗑 断舍离记录</b>
          <div class="checklist-text" style="font-size:11px;">
            <p>☐ 物品：_____ 原因：_____</p>
            <p>☐ 物品：_____ 原因：_____</p>
            <p>☐ 物品：_____ 原因：_____</p>
            <p>...</p>
          </div>
        </div>
        <div style="background:#f9f9f9;padding:12px;border-radius:8px;">
          <b>✨ 心动清单</b>
          <div class="checklist-text" style="font-size:11px;">
            <p>☐ 让我开心的物品：_____</p>
            <p>☐ 让我开心的物品：_____</p>
            <p>...</p>
          </div>
        </div>
      </div>
    </div>
    <div class="pdf-actions">
      <button class="btn-close-pdf" onclick="closePdf()">关闭</button>
      <button class="btn-print">🖨 打印</button>
      <button class="btn-share">💚 转发</button>
    </div>
  </div>
</div>

<script>
  function showAd() {
    document.getElementById('adOverlay').classList.add('show')
    let sec = 15
    document.getElementById('adTimer').textContent = sec + ' 秒'
    const timer = setInterval(() => {
      sec--
      document.getElementById('adTimer').textContent = sec + ' 秒'
      if (sec <= 5) document.getElementById('adSkip').style.display = 'block'
      if (sec <= 0) {
        clearInterval(timer)
        skipAd()
      }
    }, 1000)
  }

  function skipAd() {
    document.getElementById('adOverlay').classList.remove('show')
    document.getElementById('pdfOverlay').classList.add('show')
  }

  function closePdf() {
    document.getElementById('pdfOverlay').classList.remove('show')
  }
</script>

</body>
</html>

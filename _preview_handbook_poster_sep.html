<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8月整理计划海报</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#e8e8e8; display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height:100vh; gap:24px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  .poster {
    width:375px; height:350px; position:relative; overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.15);
    background:linear-gradient(170deg,#f6f9fc 0%,#fff 40%,#faf7f3 100%);
    display:flex; flex-direction:column; align-items:center;
  }
  .poster::before {
    content:''; position:absolute; top:-40px; right:-30px;
    width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(18,150,219,.1), transparent 70%);
  }
  .poster::after {
    content:''; position:absolute; bottom:-10px; left:-20px;
    width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle at 60% 60%, rgba(180,140,100,.08), transparent 70%);
  }

  .header { margin-top:44px; text-align:center; z-index:1; }
  .title-main {
    font-size:30px; font-weight:800; color:#1a1a1a; letter-spacing:1px;
  }
  .title-accent { color:#1296db; }
  .title-sub {
    margin-top:8px; font-size:13px; color:#999; letter-spacing:.5px;
  }

  .qr-section { margin-top:24px; z-index:1; text-align:center; }
  .qr-frame {
    width:160px; height:160px; border-radius:20px; background:#fff;
    box-shadow:0 4px 18px rgba(0,0,0,.06); padding:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .qr-frame img { width:140px; height:140px; border-radius:12px; }
  .footer-info { margin-top:auto; margin-bottom:24px; text-align:center; z-index:1; }
  .footer-row {
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .footer-name {
    font-size:12px; color:#999; letter-spacing:.5px;
  }

  .tip {
    font-size:13px; color:#aaa; text-align:center; line-height:1.8;
  }
  .tip kbd {
    background:#f0f0f0; padding:2px 8px; border-radius:4px;
    border:1px solid #ddd; font-family:inherit; font-size:12px;
  }
</style>
</head>
<body>

<div class="poster" id="poster">
  <div class="header">
    <div class="title-main"><span class="title-accent">9月整理计划</span></div>
    <div class="title-sub">本月主题 · 整理纪念品</div>
  </div>

  <div class="qr-section">
    <div class="qr-frame">
      <img src="handbookQR.png" alt="扫码进入9月整理计划">
    </div>
  </div>

  <div class="footer-info">
    <div class="footer-row">
      <span class="footer-name">— ©改变从整理开始 —</span>
    </div>
  </div>
</div>

<div class="tip">
  📸 截图方式：<kbd>F12</kbd> → <kbd>Ctrl+Shift+P</kbd> → 输入 <kbd>Capture node screenshot</kbd> → 点击海报<br>
  这样截出来的图自带圆角 ✅
</div>

</body>
</html>
